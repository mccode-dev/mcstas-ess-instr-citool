name: Publish documentation

# Builds the documentation and publishes it on GitHub Pages, for pushes to
# main and version tags (vX.Y.Z), and after each run of the workflow testing
# the instrument repositories (whose results the documentation shows).
# GitHub Pages must be enabled in the repository settings, with "GitHub
# Actions" as the source.
on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_run:
    workflows: ["Instrument repositories"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # for the test results of the instrument repositories
  pages: write
  id-token: write

# Allow only one concurrent deployment, but do not cancel a deployment in
# progress:
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and publish documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For the version of the tool (from the git tags):
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the tool and the documentation requirements
        run: python -m pip install . -r doc/requirements.txt
      # The documentation shows information from git.esss.dk (e.g. the TODO
      # files of the repositories). If it is down (and stays down for 20
      # minutes), nothing is deployed, so the previous version stays online:
      - name: Wait for git.esss.dk (up to 20 minutes)
        run: bash .github/scripts/wait-for-url.sh https://git.esss.dk/ 60 20
      - name: Build documentation
        # (The token is used for the test results of the instrument
        # repositories, from the GitHub API.)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make -C doc html SPHINXOPTS="-W --keep-going"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc/build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
