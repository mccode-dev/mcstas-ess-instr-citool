name: CI

# Pushes run these tests via pypi.yml (which calls this workflow), so they
# are not triggered by pushes here:
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # (The "ci-" prefix keeps the group different from that of pypi.yml, which
  # calls this workflow, and whose name github.workflow then refers to.)
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Lint the code of the tool (configuration in pyproject.toml):
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff
        run: ruff check

  # List the example projects, for the examples job below:
  list-examples:
    name: List example projects
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list.outputs.examples }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          python3 -c 'import json, os; print("examples=" + json.dumps(sorted(os.listdir("example_repos"))))' >> "$GITHUB_OUTPUT"

  # Test each example project like a real project: in the conda environment
  # from its own conda.yml, with the tool installed with pip:
  examples:
    name: Example ${{ matrix.example }}
    needs: list-examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.list-examples.outputs.examples) }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: example_repos/${{ matrix.example }}/conda.yml
          environment-name: example
      - name: Install the tool
        run: python -m pip install --no-deps .
      - name: Check the project layout
        run: mcstas-ess-instr-citool -a check example_repos/${{ matrix.example }}
      - name: Run the tests (runci)
        run: mcstas-ess-instr-citool -a runci example_repos/${{ matrix.example }}

  # Fast tests with plain pip-installed Python (tests needing McStas are
  # automatically skipped):
  unittests:
    name: Unit tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v

  # Full tests, including running mctest on all example projects:
  mcstas:
    name: Full tests with McStas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: mcstas
          condarc: |
            channels:
              - conda-forge
              - nodefaults
          create-args: >-
            mcstas>=3.9.0
            mcstasscript>=0.0.94
            python
            pip
            pytest
      - name: Set up MSVC compiler (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install
        run: python -m pip install --no-deps -e .
      - name: Check example projects
        run: |
          for d in example_repos/*/; do
            mcstas-ess-instr-citool -a check "$d"
            mcstas-ess-instr-citool "$d"
          done
      - name: Run tests
        run: python -m pytest -v -rs --basetemp="${{ runner.temp }}/pytest"
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-output-${{ matrix.os }}
          path: ${{ runner.temp }}/pytest
          retention-days: 7
