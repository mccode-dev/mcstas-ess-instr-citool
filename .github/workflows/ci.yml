name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Fast tests with plain pip-installed Python (tests needing McStas are
  # automatically skipped):
  unittests:
    name: Unit tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v

  # Full tests, including running mctest on all example projects:
  mcstas:
    name: Full tests with McStas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: mcstas
          condarc: |
            channels:
              - conda-forge
              - nodefaults
          create-args: >-
            mcstas>=3.8.8
            python
            pip
            pytest
      - name: Set up MSVC compiler (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install
        run: python -m pip install --no-deps -e .
      - name: Check example projects
        run: |
          for d in example_repos/*/; do
            mcstas-ess-instr-citool -a check "$d"
            mcstas-ess-instr-citool "$d"
          done
      - name: Run tests
        run: python -m pytest -v -rs --basetemp="${{ runner.temp }}/pytest"
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output-${{ matrix.os }}
          path: ${{ runner.temp }}/pytest
          retention-days: 7
