name: Publish to PyPI

# Runs on all pushes: the tests (ci.yml), then building and checking the
# distribution. Only for version tags (vX.Y.Z), and only when enabled with
# the repository variable PYPI_UPLOAD, the distribution is uploaded to PyPI
# (see the publish job).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: true

jobs:

  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is taken from the git tags (setuptools-git-versioning):
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build distribution
        run: |
          python3 -m pip install build twine
          python3 -m build
          ls -l dist
      - name: Check distribution
        run: python3 -m twine check --strict dist/*
      - name: Check version
        run: |
          # Install the wheel in a clean environment, and check that the
          # version it reports is that of the distribution files (and, when
          # building a vX.Y.Z tag, that of the tag):
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          version=$(cd /tmp && /tmp/venv/bin/mcstas-ess-instr-citool --version | awk '{print $2}')
          echo "Version: $version"
          ls dist | grep -q -F -- "-${version}-py3-none-any.whl"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$version" == "${GITHUB_REF_NAME#v}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Uploading is only done for version tags (vX.Y.Z), and only once it
      # is enabled by setting the repository variable PYPI_UPLOAD to "true"
      # (after configuring trusted publishing on PyPI, see the README):
      - name: Stop before uploading
        if: ${{ !(vars.PYPI_UPLOAD == 'true' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          ls -l dist
          echo "::notice::Not uploading to PyPI (only done for vX.Y.Z tags, when the repository variable PYPI_UPLOAD is true)."
      - name: Upload distribution to PyPI
        if: ${{ vars.PYPI_UPLOAD == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
