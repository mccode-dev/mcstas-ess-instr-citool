name: Documentation

# Builds the documentation (warnings are errors) and checks its links. The
# documentation is published by publish-doc.yml.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # for the test results of the instrument repositories

concurrency:
  group: doc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For the version of the tool (from the git tags):
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the tool and the documentation requirements
        run: python -m pip install . -r doc/requirements.txt
      - name: Build documentation
        # (The token is used for the test results of the instrument
        # repositories, from the GitHub API.)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make -C doc html SPHINXOPTS="-W --keep-going"
      - name: Check links
        run: make -C doc linkcheck
