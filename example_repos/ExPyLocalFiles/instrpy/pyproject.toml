[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ExPyLocalFiles"
version = "0.0.0"
description = "McStasScript instrument using a local component and data file"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["ExPyLocalFiles_instr"]

[tool.setuptools.package-data]
ExPyLocalFiles_instr = ["localcomps/*", "localdata/*"]
